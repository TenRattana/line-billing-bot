server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for an internal admin tool.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://profile.line-scdn.net https://*.line-scdn.net data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # The API container; its unique name avoids other projects on the shared network.
    location /api/ {
        proxy_pass http://backoffice-api:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: every other path renders index.html.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
