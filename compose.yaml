name: line-billing-test

# The database is `line_billing_test` (role `line_billing_test`) on the shared central-db;
# DATABASE_URL in .env points at host `central-db`. Migrations run on bot start.

services:
  # Not "app": Docker adds the service name as an alias on every network, and
  # production line-oa already answers to "app" on the shared line-router-net.
  billing-test-bot:
    # nginx-cloudflare proxies /line-oa-test to this name (http://line-billing-test-bot:8500).
    container_name: line-billing-test-bot
    # CI builds and pushes the images; the server only pulls them (`docker compose pull && docker compose up -d`).
    image: ${BOT_IMAGE:?set BOT_IMAGE, e.g. ghcr.io/<owner>/line-billing-bot:latest}
    build: .  # local builds only
    restart: unless-stopped
    ports:
      - "127.0.0.1:18500:8500"
    env_file:
      - .env
    environment:
      ATTACHMENT_DIR: /data/validated/slips
      EMPLOYEE_DB_ENV_FILE: /run/secrets/central-db.env
      TEST_TEXT_COMMANDS_ENABLED: "true"
    networks:
      default:
      central:  # nginx-cloudflare and central-db
    # Only data and secrets live on the server; the code is in the image.
    volumes:
      - ./data:/data:z
      - ../db/.env:/run/secrets/central-db.env:ro,Z

  backoffice-api:
    image: ${BOT_IMAGE:?set BOT_IMAGE}  # same image as the bot, other entrypoint
    restart: unless-stopped
    entrypoint: ["uv", "run", "--no-sync", "uvicorn", "backoffice.api.main:app", "--host", "0.0.0.0", "--port", "8600"]
    env_file:
      - .env
    environment:
      ATTACHMENT_DIR: /data/validated/slips
    networks:
      default:
      # central-db's own network (only central-db + pgAdmin), not line-router-net:
      # production's backoffice already answers to "backoffice-api" there.
      central-db:
    volumes:
      - ./data:/data:ro,z

  backoffice-web:
    image: ${BACKOFFICE_WEB_IMAGE:?set BACKOFFICE_WEB_IMAGE, e.g. ghcr.io/<owner>/line-billing-backoffice-web:latest}
    build: ./backoffice/web  # local builds only
    restart: unless-stopped
    # Open to the LAN like production's :8510; the app itself requires a login.
    ports:
      - "0.0.0.0:18510:80"
    depends_on:
      - backoffice-api

networks:
  default:
    name: line-billing-test-net
  central:
    name: line-router-net
    external: true
  central-db:
    name: db_default
    external: true
